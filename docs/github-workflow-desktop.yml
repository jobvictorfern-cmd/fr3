name: Aplicativo desktop

# Gera o instalador do Windows. Rode manualmente em Actions -> "Aplicativo
# desktop" -> "Run workflow", ou publique uma tag `v*` para anexar o instalador
# a uma release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias
        run: npm ci

      - name: Testes
        run: npm test

      - name: Gerar instalador
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: editor-fr3-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/*.exe

      - name: Anexar a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
